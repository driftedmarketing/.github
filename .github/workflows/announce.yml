# Reusable: every Drifted repo calls this on push and on pull request.
# It writes a one-line announcement, comments it on the commit or PR,
# and emails the team if the mailbox secrets exist. It never merges anything.
name: announce
on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY: { required: false }
      MAIL_USERNAME: { required: false }
      MAIL_PASSWORD: { required: false }
      TEAM_EMAILS: { required: false }
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  announce:
    runs-on: ubuntu-latest
    env:
      HAS_MAIL: ${{ secrets.MAIL_USERNAME != '' && secrets.MAIL_PASSWORD != '' && secrets.TEAM_EMAILS != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/.github
          path: hub
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd hub/scripts && npm init -y >/dev/null && npm i @anthropic-ai/sdk@latest >/dev/null
      - name: Write the line
        id: line
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVENT_JSON: ${{ toJSON(github.event) }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          KIND: ${{ github.event_name == 'pull_request' && 'pr' || 'push' }}
          REF: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          TITLE: ${{ github.event.pull_request.title }}
          URL: ${{ github.event.pull_request.html_url || github.event.compare || github.event.head_commit.url }}
          OUT: ${{ github.workspace }}/announce.txt
        run: |
          node hub/scripts/announce.mjs
          echo "subject=$(head -1 announce.txt)" >> "$GITHUB_OUTPUT"
      - name: Comment it where the work is
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          body="$(tail -n +3 announce.txt)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            num="${{ github.event.pull_request.number }}"
          else
            num="$(gh pr list --repo "${{ github.repository }}" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          fi
          if [ -n "$num" ]; then
            gh pr comment "$num" --repo "${{ github.repository }}" --body "$body"
          else
            echo "No pull request open for $BRANCH yet; the line is in the job summary and the email."
          fi
          { echo '### Announcement'; echo; echo "$body"; } >> "$GITHUB_STEP_SUMMARY"
      # The mailbox credential is the one thing here that can fail for a reason
      # outside the repo being pushed. HAS_MAIL only proves the three secrets
      # EXIST; it cannot prove Gmail will accept them, and from 5 Sep it did not
      # — every push in the org went red on a credential, so a genuinely broken
      # build and a stale password looked identical in the runs list. The step
      # is allowed to fail without reddening the run, and the step after it
      # states which happened. Never let this report success while sending
      # nothing: that is the failure this guard replaced.
      - name: Email the team
        id: mail
        if: env.HAS_MAIL == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: "Drifted Hub <${{ secrets.MAIL_USERNAME }}>"
          to: ${{ secrets.TEAM_EMAILS }}
          subject: "${{ steps.line.outputs.subject || 'Drifted, new work is up' }}"
          body: file://announce.txt

      - name: Say what the mail did
        if: always()
        run: |
          if [ "${{ env.HAS_MAIL }}" != 'true' ]; then
            line='Mail: not configured. The mailbox secrets are not all set on this org, so no mail was attempted.'
          elif [ "${{ steps.mail.outcome }}" = 'success' ]; then
            line='Mail: sent.'
          else
            line='Mail: FAILED to send. The announcement above is still correct; only delivery failed. Check the org MAIL_USERNAME / MAIL_PASSWORD secrets — Gmail rejects an ordinary password here, it needs an app password.'
          fi
          echo "$line"
          { echo; echo "$line"; } >> "$GITHUB_STEP_SUMMARY"
